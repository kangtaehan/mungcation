name: Build Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test --concurrency=1

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build web app
        run: flutter build web --target lib/main_web.dart --release --no-web-resources-cdn

      - name: Test web support in Chrome
        run: flutter test --platform chrome test/platform_support_test.dart test/place_name_display_test.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mungcation-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
