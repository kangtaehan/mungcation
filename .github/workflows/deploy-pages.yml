name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 0 5 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify park data import
        run: python3 tool/test_update_national_parks.py

      - name: Refresh public park snapshot on scheduled or manual deployments
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tool/update_national_parks.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test --concurrency=1

      - name: Verify map layout and full place names in Chrome
        run: flutter test --platform chrome test/place_name_display_test.dart test/map_explorer_layout_test.dart test/map_location_entry_test.dart test/national_park_catalog_test.dart

      - name: Build web app
        run: flutter build web --target lib/main_web.dart --release --base-href /mungcation/ --no-web-resources-cdn

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
