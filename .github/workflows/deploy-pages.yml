name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 0 5 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify park data import
        run: |
          python3 tool/test_update_national_parks.py
          python3 tool/test_update_pet_places.py
          python3 tool/test_compare_walking_routes.py
          python3 tool/test_build_release.py

      - name: Check shared VWorld release key
        run: python3 tool/build_release.py web --check

      - name: Refresh public park snapshot on scheduled or manual deployments
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tool/update_national_parks.py
          python3 tool/update_pet_places.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test --concurrency=1

      - name: Serve current park asset to browser tests
        run: |
          mkdir -p test/fixtures
          cp assets/data/national_parks.json test/fixtures/national_parks.json
          cp assets/data/pet_places.json test/fixtures/pet_places.json
          cp assets/data/pet_food_registry.json test/fixtures/pet_food_registry.json

      - name: Verify map layout and full place names in Chrome
        run: flutter test --platform chrome test/platform_support_test.dart test/place_name_display_test.dart test/map_explorer_layout_test.dart test/map_location_entry_test.dart test/national_park_catalog_test.dart test/pet_admission_test.dart test/pet_place_catalog_test.dart test/pet_friendly_map_service_test.dart test/pet_admission_panel_test.dart test/pet_place_map_test.dart test/pet_place_flow_test.dart test/pet_place_data_test.dart test/vworld_configuration_test.dart test/vworld_map_test.dart test/outing_preparation_test.dart test/outing_widgets_test.dart

      - name: Build web app
        run: python3 tool/build_release.py web

      - name: Verify deployed park asset matches the tested snapshot
        run: |
          cmp assets/data/national_parks.json build/web/assets/assets/data/national_parks.json
          cmp assets/data/pet_places.json build/web/assets/assets/data/pet_places.json
          cmp assets/data/pet_food_registry.json build/web/assets/assets/data/pet_food_registry.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
