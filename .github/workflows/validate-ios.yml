name: Validate iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true
      - name: Analyze, test and compile unsigned simulator app
        run: bash tool/verify_ios.sh
      - name: Run native tests on an available iPhone simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,items in d["devices"].items() if "iOS" in k for v in items if v["name"].startswith("iPhone")))')
          xcodebuild test-without-building \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO
