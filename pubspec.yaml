name: mungcation
description: Mungcation iOS and Android pixel pet walking app
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/pixel_room.png
