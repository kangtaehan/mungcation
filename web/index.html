<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="멍케이션 Flutter iOS·Android 앱 미리보기">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#205C40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="멍케이션 미리보기">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>멍케이션</title>
</head>
<body>
  <div id="mungcation-loading" style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:30vh 24px;color:#205c40">
    <div style="font-size:28px;font-weight:800">멍케이션</div>
    <div id="mungcation-status" style="margin-top:12px;font-size:15px">앱을 불러오는 중입니다…</div>
  </div>
  <script>
    const loading = document.getElementById('mungcation-loading');
    const status = document.getElementById('mungcation-status');

    window.addEventListener('flutter-first-frame', () => loading?.remove());
    window.addEventListener('error', (event) => {
      if (status) status.textContent = `실행 오류: ${event.message || '알 수 없는 오류'}`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      if (status) status.textContent = `실행 오류: ${event.reason || '앱 초기화 실패'}`;
    });

    async function startMungcation() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
      } catch (_) {
        // Cache cleanup is optional; continue loading when Safari blocks storage.
      }

      const script = document.createElement('script');
      script.src = `flutter_bootstrap.js?v=4`;
      script.async = true;
      script.onerror = () => {
        if (status) status.textContent = '앱 파일을 불러오지 못했습니다. Safari에서 다시 시도해 주세요.';
      };
      document.body.appendChild(script);
    }

    startMungcation();
  </script>
</body>
</html>
